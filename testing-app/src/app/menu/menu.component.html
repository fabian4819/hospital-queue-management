<h1 class="title">Customer Queue Management</h1>
<p class="subtitle">Layanan antrean pengunjung walk-in RS Sehat Sentosa</p>

<div class="cards">
  <a mat-raised-button class="card queue" routerLink="/request-queue-number">
    <mat-icon>confirmation_number</mat-icon>
    <span class="name">Print Queue Number</span>
    <span class="desc">Ambil dan cetak nomor antrean</span>
  </a>
  <a mat-raised-button class="card input" routerLink="/input-visitor-details">
    <mat-icon>assignment_ind</mat-icon>
    <span class="name">Input Visitor Details</span>
    <span class="desc">Isi biodata pengunjung dari nomor antrean</span>
  </a>
  <a mat-raised-button class="card list" routerLink="/visitor-list">
    <mat-icon>list_alt</mat-icon>
    <span class="name">Visitor List</span>
    <span class="desc">Cari, panggil, dan export data pengunjung</span>
  </a>
</div>
